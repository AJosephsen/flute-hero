<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>flute-hero</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <main class="app">
    <div class="dynamic-ui"></div>

    <section class="panel lane-wrap">
      <div class="lane-label"><img src="./art/ui/star-badge.svg" alt="" /> Magic note path</div>
      <canvas id="noteLane" width="960" height="320" aria-label="Scrolling note lane"></canvas>
    </section>

    <details class="panel debug" aria-label="Debug timing and pitch telemetry">
      <summary>Debug</summary>
      <dl>
        <div><dt>Frame</dt><dd id="debugFrameTime">—</dd></div>
        <div><dt>Audio latency</dt><dd id="debugAudioLatency">—</dd></div>
        <div><dt>Frequency</dt><dd id="debugFrequency">—</dd></div>
        <div><dt>Confidence</dt><dd id="debugConfidence">—</dd></div>
      </dl>
    </details>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
